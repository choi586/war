<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>귀여운 땅따먹기 게임!</title>
    <!-- 🌟 귀여운 Jua 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            margin: 0;
            padding: 0;
            /* 귀여운 딸기우유빛 땡땡이 배경 */
            background-color: #fff0f5;
            background-image: radial-gradient(#ffb6c1 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #555;
        }

        #game-container {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4), inset 0 0 10px rgba(255,255,255,1);
            position: relative;
            max-width: 100%;
            max-height: 100vh;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #canvas-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* 모바일에서 스와이프할 때 화면 안 움직이게 고정 */
        }

        /* 게임 도화지 */
        canvas {
            background-color: #ffffff;
            border: 6px solid #ffb6c1;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.3);
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }

        #sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: white;
            border: 3px solid #ffe4e1;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            height: 100%;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2);
        }

        .panel h2 { margin: 0 0 15px 0; color: #ff69b4; font-size: 24px; text-shadow: 1px 1px 0px #ffe4e1; }

        /* 접속자 목록 디자인 */
        #player-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            max-height: 60vh;
            overflow-y: auto;
        }

        #player-list li {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #fffafa;
            border-radius: 12px;
            border-left: 8px solid #ccc;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        #player-list li:hover { transform: scale(1.02); }

        /* 화면 덮개 (시작/종료) */
        #login-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            z-index: 10;
        }

        input {
            padding: 15px 20px;
            font-size: 22px;
            font-family: 'Jua', sans-serif;
            border: 4px solid #ffb6c1;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            width: 240px;
            outline: none;
            color: #ff69b4;
            background: #fffafa;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
        }
        
        input:focus { border-color: #ff69b4; }
        input::placeholder { color: #ffc0cb; }

        button {
            padding: 15px 50px;
            font-size: 26px;
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #ff69b4, #ffb6c1);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        button:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(255, 105, 180, 0.6); }
        button:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4); }
        button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .hidden { display: none !important; }
        h1 { color: #ff1493; margin-bottom: 10px; font-size: 42px; text-shadow: 2px 2px 0px #ffe4e1; text-align: center; }
        #game-over-text { color: #ff69b4; font-size: 28px; margin-bottom: 30px; white-space: pre-line; text-align: center; line-height: 1.5;}

        /* 모바일 반응형 */
        @media (max-width: 900px) {
            #game-container { flex-direction: column; padding: 10px; border-radius: 0; height: 100vh; justify-content: flex-start; background: transparent; box-shadow: none;}
            canvas { max-height: 55vh; border-radius: 15px;}
            #sidebar { width: 100%; flex: 1; }
            #login-screen, #game-over-screen { border-radius: 0; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 시작 화면 -->
        <div id="login-screen">
            <h1>🎨 젤리 땅따먹기</h1>
            <p style="color: #ff69b4; margin-bottom: 25px; font-size: 20px;">화면을 스와이프해서 이동하세요!</p>
            <input type="text" id="nickname" placeholder="내 이름은?" maxlength="5">
            <button id="start-btn">시작하기!</button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="game-over-screen" class="hidden">
            <h1>앗, 부딪혔어요! 💦</h1>
            <div id="game-over-text">다시 도전해보세요!</div>
            <button id="restart-btn">다시 할래!</button>
        </div>

        <!-- 게임 화면 영역 -->
        <div id="canvas-wrapper">
            <canvas id="game-canvas" width="800" height="600"></canvas>
        </div>

        <!-- 오른쪽 접속자 목록 -->
        <div id="sidebar">
            <div class="panel">
                <h2>🏆 실시간 랭킹</h2>
                <ul id="player-list">
                    <!-- 접속한 사람들이 여기에 표시됩니다 -->
                </ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ============================================================
        // Firebase 설정 - GitHub Pages에서 그대로 작동하는 웹앱용 설정
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDrqOcf1Df1mrtR7l-Q9H8bjnqweaxclVk",
            authDomain: "paperio-92034.firebaseapp.com",
            projectId: "paperio-92034",
            storageBucket: "paperio-92034.firebasestorage.app",
            messagingSenderId: "847215519861",
            appId: "1:847215519861:web:2877938b164b0a764a303c",
            measurementId: "G-E6XQF20XH8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Firestore 경로: games / jelly-paper-io / players / 사용자UID
        const appId = 'jelly-paper-io';

        // 🌟 게임 기본 설정
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        // 🚀 대규모 맵 설정 (20명 수용 가능하도록 250칸으로 대폭 확장)
        const GRID_SIZE = 250; 
        const CELL_SIZE = 20;  
        const MAP_WIDTH = GRID_SIZE * CELL_SIZE;  // 5000 픽셀
        const MAP_HEIGHT = GRID_SIZE * CELL_SIZE; // 5000 픽셀
        const TOTAL_AREA = GRID_SIZE * GRID_SIZE;

        const GAME_TICK = 100; // 이동 속도
        const SYNC_INTERVAL = 1000; // Firestore 무료 한도를 과도하게 소모하지 않도록 위치 동기화 완화
        const ACTIVE_TIMEOUT = 10000;

        let myUid = null;
        let myPlayer = null;
        let players = {}; 

        let gameLoopInterval = null;
        let syncInterval = null;
        let unsubscribePlayers = null;
        let inputControlsReady = false;
        let animationStarted = false;
        let gameSessionId = null;

        // 보조 함수
        function isMyTerritory(x, y, territory = []) { return territory.some(t => t.x === x && t.y === y); }
        function isMyTrail(x, y, trail = []) { return trail.some(t => t.x === x && t.y === y); }
        function shortName(name) {
            return Array.from((name || '젤리').trim()).slice(0, 5).join('') || '젤리';
        }

        function getRandomColor() {
            const colors = ['#FFB6C1', '#87CEFA', '#98FB98', '#FFDAB9', '#E6E6FA', '#F08080', '#20B2AA', '#FFA07A'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = true;
        startBtn.textContent = '서버 연결 중...';

        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("익명 로그인 실패:", error);
                startBtn.textContent = '연결 실패 - 새로고침';
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                myUid = user.uid;
                startBtn.disabled = false;
                startBtn.textContent = '시작하기!';
            }
        });

        initAuth();

        async function syncToFirebase(includeTerritory = false) {
            if (!myUid || !myPlayer) return;
            try {
                const playerRef = doc(db, 'games', appId, 'players', myUid);
                myPlayer.lastActive = Date.now();
                const playerData = {
                    uid: myPlayer.uid,
                    sessionId: myPlayer.sessionId,
                    name: myPlayer.name,
                    color: myPlayer.color,
                    x: myPlayer.x,
                    y: myPlayer.y,
                    dx: myPlayer.dx,
                    dy: myPlayer.dy,
                    nextDx: myPlayer.nextDx,
                    nextDy: myPlayer.nextDy,
                    trail: myPlayer.trail,
                    isAlive: myPlayer.isAlive,
                    lastActive: myPlayer.lastActive
                };

                if (includeTerritory) {
                    playerData.territory = myPlayer.territory;
                    playerData.score = myPlayer.score;
                    playerData.percent = myPlayer.percent;
                }
                await setDoc(playerRef, playerData, { merge: true });
            } catch (error) {
                console.warn('Firebase 동기화 실패:', error);
            }
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        async function startGame() {
            const nickname = shortName(document.getElementById('nickname').value);
            if (!myUid) {
                alert('게임 서버에 연결 중입니다. 잠시 후 다시 눌러주세요.');
                return;
            }

            if (gameLoopInterval) clearInterval(gameLoopInterval);
            if (syncInterval) clearInterval(syncInterval);
            gameLoopInterval = null;
            syncInterval = null;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            gameSessionId = `${myUid}-${Date.now()}-${Math.floor(Math.random() * 100000)}`;

            // 🌟 250x250 거대한 맵 어디서든 태어날 수 있게 스폰 반경 확장 (가장자리 20칸 제외)
            const startX = Math.floor(Math.random() * (GRID_SIZE - 40)) + 20;
            const startY = Math.floor(Math.random() * (GRID_SIZE - 40)) + 20;

            myPlayer = {
                uid: myUid, sessionId: gameSessionId, name: nickname, color: getRandomColor(),
                x: startX, y: startY,
                dx: 0, dy: -1, nextDx: 0, nextDy: -1,
                trail: [], territory: [],
                score: 9, percent: (9 / TOTAL_AREA * 100).toFixed(4), // 소수점 4자리까지 표시 (맵이 커져서)
                isAlive: true, lastActive: Date.now()
            };

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    myPlayer.territory.push({ x: startX + dx, y: startY + dy });
                }
            }

            await syncToFirebase(true);
            listenToGameData();

            if (!inputControlsReady) {
                window.addEventListener('keydown', handleInput);
                setupSwipeControls();
                inputControlsReady = true;
            }

            gameLoopInterval = setInterval(updateGameLogic, GAME_TICK); 
            syncInterval = setInterval(syncToFirebase, SYNC_INTERVAL);
            if (!animationStarted) {
                animationStarted = true;
                requestAnimationFrame(drawGame);
            }
        }

        function listenToGameData() {
            if (unsubscribePlayers) return;
            const playersRef = collection(db, 'games', appId, 'players');
            unsubscribePlayers = onSnapshot(playersRef, (snapshot) => {
                players = {};
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (!data.lastActive || Date.now() - data.lastActive < ACTIVE_TIMEOUT) {
                        players[docSnap.id] = data;
                    }
                });

                const remoteMe = players[myUid];
                if (remoteMe && remoteMe.isAlive === false && myPlayer && myPlayer.isAlive === true) {
                    if (remoteMe.sessionId === myPlayer.sessionId) die();
                }
                if (myPlayer && myPlayer.isAlive) {
                    players[myUid] = { ...(players[myUid] || {}), ...myPlayer };
                }
                updatePlayerList();
            });
        }

        function handleInput(e) {
            if (e.key === 'ArrowUp' || e.key === 'w') setDirection(0, -1);
            else if (e.key === 'ArrowDown' || e.key === 's') setDirection(0, 1);
            else if (e.key === 'ArrowLeft' || e.key === 'a') setDirection(-1, 0);
            else if (e.key === 'ArrowRight' || e.key === 'd') setDirection(1, 0);
        }

        function setDirection(dx, dy) {
            if (!myPlayer || !myPlayer.isAlive) return;
            if (dx !== 0 && myPlayer.dy !== 0) { myPlayer.nextDx = dx; myPlayer.nextDy = 0; }
            if (dy !== 0 && myPlayer.dx !== 0) { myPlayer.nextDx = 0; myPlayer.nextDy = dy; }
        }

        function setupSwipeControls() {
            let touchStartX = 0;
            let touchStartY = 0;
            const canvasWrapper = document.getElementById('canvas-wrapper');

            canvasWrapper.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: false });

            canvasWrapper.addEventListener('touchmove', (e) => {
                e.preventDefault(); 
                let touchEndX = e.changedTouches[0].screenX;
                let touchEndY = e.changedTouches[0].screenY;
                
                let dx = touchEndX - touchStartX;
                let dy = touchEndY - touchStartY;
                
                const threshold = 30; 

                if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) setDirection(1, 0); 
                        else setDirection(-1, 0); 
                    } else {
                        if (dy > 0) setDirection(0, 1); 
                        else setDirection(0, -1); 
                    }
                    touchStartX = touchEndX;
                    touchStartY = touchEndY;
                }
            }, { passive: false });
        }

        async function killPlayerIfSameSession(uid, expectedSessionId) {
            if (!uid || !expectedSessionId) return;
            const playerRef = doc(db, 'games', appId, 'players', uid);
            try {
                await runTransaction(db, async (transaction) => {
                    const snapshot = await transaction.get(playerRef);
                    if (!snapshot.exists()) return;
                    const current = snapshot.data();
                    if (current.sessionId === expectedSessionId && current.isAlive === true) {
                        transaction.update(playerRef, {
                            isAlive: false,
                            lastActive: Date.now()
                        });
                    }
                });
            } catch (error) {
                console.warn('상대 죽이기 처리 실패:', error);
            }
        }

        function updateGameLogic() {
            if (!myPlayer || !myPlayer.isAlive) return;

            myPlayer.dx = myPlayer.nextDx;
            myPlayer.dy = myPlayer.nextDy;

            let nextX = myPlayer.x + myPlayer.dx;
            let nextY = myPlayer.y + myPlayer.dy;

            if (nextX < 0 || nextX >= GRID_SIZE || nextY < 0 || nextY >= GRID_SIZE) { die(); return; }
            if (isMyTrail(nextX, nextY, myPlayer.trail)) { die(); return; }

            for (const uid in players) {
                if (uid !== myUid && players[uid].isAlive) {
                    if (isMyTrail(nextX, nextY, players[uid].trail)) {
                        killPlayerIfSameSession(uid, players[uid].sessionId);
                    }
                }
            }

            myPlayer.x = nextX;
            myPlayer.y = nextY;
            myPlayer.lastActive = Date.now();

            if (isMyTerritory(nextX, nextY, myPlayer.territory)) {
                if (myPlayer.trail.length > 0) {
                    captureTerritory(); 
                    myPlayer.trail = [];
                    syncToFirebase(true);
                }
            } else {
                myPlayer.trail.push({ x: nextX, y: nextY });
            }
        }

        function captureTerritory() {
            let map = Array(GRID_SIZE).fill().map(() => new Uint8Array(GRID_SIZE));
            myPlayer.territory.forEach(p => map[p.y][p.x] = 1);
            myPlayer.trail.forEach(p => map[p.y][p.x] = 1);

            let queue = [];
            for(let i=0; i<GRID_SIZE; i++) {
                if(map[0][i] === 0) { queue.push({x: i, y: 0}); map[0][i] = 2; }
                if(map[GRID_SIZE-1][i] === 0) { queue.push({x: i, y: GRID_SIZE-1}); map[GRID_SIZE-1][i] = 2; }
                if(map[i][0] === 0) { queue.push({x: 0, y: i}); map[i][0] = 2; }
                if(map[i][GRID_SIZE-1] === 0) { queue.push({x: GRID_SIZE-1, y: i}); map[i][GRID_SIZE-1] = 2; }
            }

            let head = 0;
            while(head < queue.length) {
                let curr = queue[head++];
                let cx = curr.x, cy = curr.y;
                if (cx > 0 && map[cy][cx-1] === 0) { map[cy][cx-1] = 2; queue.push({x: cx-1, y: cy}); }
                if (cx < GRID_SIZE-1 && map[cy][cx+1] === 0) { map[cy][cx+1] = 2; queue.push({x: cx+1, y: cy}); }
                if (cy > 0 && map[cy-1][cx] === 0) { map[cy-1][cx] = 2; queue.push({x: cx, y: cy-1}); }
                if (cy < GRID_SIZE-1 && map[cy+1][cx] === 0) { map[cy+1][cx] = 2; queue.push({x: cx, y: cy+1}); }
            }

            let newTerritory = [];
            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    if(map[y][x] !== 2) newTerritory.push({x: x, y: y});
                }
            }
            myPlayer.territory = newTerritory;
            myPlayer.score = newTerritory.length;
            myPlayer.percent = ((myPlayer.score / TOTAL_AREA) * 100).toFixed(4); // 맵이 커서 소수점 늘림
        }

        function die() {
            if (!myPlayer) return;
            myPlayer.isAlive = false;
            syncToFirebase();
            clearInterval(gameLoopInterval);
            clearInterval(syncInterval);
            gameLoopInterval = null;
            syncInterval = null;
            
            let rank = 1;
            const myScore = myPlayer.score || 0;
            for (let uid in players) {
                if (uid !== myUid && players[uid].isAlive && (players[uid].score || 0) > myScore) rank++;
            }

            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-text').innerText = `내 순위: ${rank}위\n내 땅 넓이: ${myPlayer.percent}%`;
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!myPlayer) { requestAnimationFrame(drawGame); return; }

            let cameraX = (myPlayer.x * CELL_SIZE) - (canvas.width / 2) + (CELL_SIZE / 2);
            let cameraY = (myPlayer.y * CELL_SIZE) - (canvas.height / 2) + (CELL_SIZE / 2);

            const maxCamX = MAP_WIDTH - canvas.width;
            const maxCamY = MAP_HEIGHT - canvas.height;
            cameraX = Math.max(0, Math.min(cameraX, maxCamX));
            cameraY = Math.max(0, Math.min(cameraY, maxCamY));

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // 🚀 최적화(Culling) 계산: 화면(카메라)에 보이는 영역(Start/End)만 구하기
            const cullPad = 1;
            const startCol = Math.max(0, Math.floor(cameraX / CELL_SIZE) - cullPad);
            const endCol = Math.min(GRID_SIZE, Math.ceil((cameraX + canvas.width) / CELL_SIZE) + cullPad);
            const startRow = Math.max(0, Math.floor(cameraY / CELL_SIZE) - cullPad);
            const endRow = Math.min(GRID_SIZE, Math.ceil((cameraY + canvas.height) / CELL_SIZE) + cullPad);

            ctx.strokeStyle = '#f5f5f5';
            ctx.lineWidth = 1;
            for (let x = startCol; x <= endCol; x++) { ctx.beginPath(); ctx.moveTo(x * CELL_SIZE, startRow * CELL_SIZE); ctx.lineTo(x * CELL_SIZE, endRow * CELL_SIZE); ctx.stroke(); }
            for (let y = startRow; y <= endRow; y++) { ctx.beginPath(); ctx.moveTo(startCol * CELL_SIZE, y * CELL_SIZE); ctx.lineTo(endCol * CELL_SIZE, y * CELL_SIZE); ctx.stroke(); }

            // 플레이어 그리기 (화면에 보이는 땅만 그리도록 최적화)
            for (const uid in players) {
                const p = players[uid];
                if (!p.isAlive) continue; 
                
                ctx.fillStyle = p.color;
                
                // 1. 땅 그리기 (최적화 적용)
                ctx.globalAlpha = 0.5;
                if(p.territory) {
                    p.territory.forEach(t => {
                        // 🚀 내 화면에 보이는 땅만 그립니다 (렉 방지)
                        if (t.x >= startCol && t.x <= endCol && t.y >= startRow && t.y <= endRow) {
                            ctx.fillRect(t.x * CELL_SIZE, t.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    });
                }

                // 2. 꼬리 그리기 (최적화 적용)
                ctx.globalAlpha = 0.9;
                if(p.trail) {
                    p.trail.forEach(t => {
                        if (t.x >= startCol && t.x <= endCol && t.y >= startRow && t.y <= endRow) {
                            ctx.fillRect(t.x * CELL_SIZE, t.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    });
                }

                ctx.globalAlpha = 1.0;
                
                // 캐릭터 본체는 위치 상관없이 계산 (캐릭터는 1개니까 부하 적음)
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.roundRect(p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE, 4);
                ctx.fill();
                
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#666';
                ctx.font = 'bold 14px "Jua", sans-serif';
                ctx.textAlign = 'center';
                if (uid === myUid) {
                    ctx.fillText('⭐ ' + p.name, p.x * CELL_SIZE + (CELL_SIZE/2), p.y * CELL_SIZE - 8);
                } else {
                    ctx.fillText(p.name, p.x * CELL_SIZE + (CELL_SIZE/2), p.y * CELL_SIZE - 8);
                }
            }

            ctx.restore();

            /* ====================================================================
               🌟 우측 하단 미니맵 (전체 맵)
            ==================================================================== */
            const MINIMAP_SIZE = 140; // 맵이 커져서 미니맵도 살짝 키움
            const minimapScale = MINIMAP_SIZE / GRID_SIZE; 
            const minimapX = canvas.width - MINIMAP_SIZE - 15; 
            const minimapY = canvas.height - MINIMAP_SIZE - 15; 

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath(); ctx.roundRect(minimapX, minimapY, MINIMAP_SIZE, MINIMAP_SIZE, 10); ctx.fill();
            ctx.strokeStyle = '#ffb6c1';
            ctx.lineWidth = 3;
            ctx.stroke();

            for (const uid in players) {
                const p = players[uid];
                if (!p.isAlive) continue; 
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.6;
                if(p.territory) {
                    p.territory.forEach(t => {
                        // 미니맵 점이 너무 작아 보이지 않게 +0.5 보정
                        ctx.fillRect(minimapX + t.x * minimapScale, minimapY + t.y * minimapScale, minimapScale + 0.5, minimapScale + 0.5);
                    });
                }

                ctx.globalAlpha = 1.0;
                if (uid === myUid) {
                    ctx.fillStyle = '#ff1493'; 
                    ctx.fillRect(minimapX + p.x * minimapScale - 2, minimapY + p.y * minimapScale - 2, minimapScale + 4, minimapScale + 4);
                }
                ctx.fillStyle = p.color;
                ctx.fillRect(minimapX + p.x * minimapScale - 1, minimapY + p.y * minimapScale - 1, minimapScale + 2, minimapScale + 2);
            }

            requestAnimationFrame(drawGame);
        }

        function updatePlayerList() {
            const list = document.getElementById('player-list');
            list.innerHTML = ''; 
            const sortedPlayers = Object.values(players).filter(p => p.isAlive).sort((a, b) => (b.score || 0) - (a.score || 0));

            sortedPlayers.forEach(p => {
                const li = document.createElement('li');
                li.style.borderLeftColor = p.color;
                const percent = p.percent || "0.0000";
                const nameText = p.uid === myUid ? `⭐ ${shortName(p.name)}` : shortName(p.name);
                const nameSpan = document.createElement('span');
                nameSpan.textContent = nameText;
                const percentSpan = document.createElement('span');
                percentSpan.style.fontSize = '16px';
                percentSpan.style.color = '#888';
                percentSpan.textContent = `${percent}%`;
                li.append(nameSpan, percentSpan);
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
