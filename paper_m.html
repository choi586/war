<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>귀여운 땅따먹기 게임!</title>
    <!-- 🌟 귀여운 Jua 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            font-family: 'Jua', sans-serif;
            background: #fafafa;
            color: #555;
            position: fixed;
            inset: 0;
        }

        #game-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #fafafa;
        }

        #canvas-wrapper {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            display: block;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100dvh;
            background: #ffffff;
            border: none;
            border-radius: 0;
            box-shadow: none;
            touch-action: none;
        }

        /* 우측 상단 랭킹: 박스 없이 화면 위에 띄우기 */
        #sidebar {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            right: max(10px, env(safe-area-inset-right));
            z-index: 5;
            width: 170px;
            pointer-events: none;
        }

        .panel {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            text-align: right;
            box-shadow: none;
        }

        .panel h2 {
            margin: 0 0 5px 0;
            color: #ff1493;
            font-size: 17px;
            line-height: 1.1;
            text-shadow:
                0 2px 4px rgba(255,255,255,0.95),
                0 0 6px rgba(255,255,255,0.95),
                1px 1px 0 rgba(255,255,255,0.9);
        }

        #player-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: right;
            max-height: 42vh;
            overflow: hidden;
        }

        #player-list li {
            padding: 0;
            margin: 0 0 3px 0;
            background: transparent;
            border: none;
            border-left: none !important;
            border-radius: 0;
            box-shadow: none;
            font-size: 15px;
            line-height: 1.15;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            color: #333;
            text-shadow:
                0 2px 4px rgba(255,255,255,1),
                0 0 5px rgba(255,255,255,1),
                1px 1px 0 rgba(255,255,255,0.95);
        }

        #player-list li .rank-name {
            max-width: 88px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #player-list li .rank-percent {
            min-width: 54px;
            color: #555;
            font-size: 13px;
        }

        /* 화면 덮개 (시작/종료) */
        #login-screen, #game-over-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-sizing: border-box;
            padding: 20px;
        }

        input {
            padding: 15px 20px;
            font-size: 22px;
            font-family: 'Jua', sans-serif;
            border: 4px solid #ffb6c1;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            width: min(240px, 80vw);
            outline: none;
            color: #ff69b4;
            background: #fffafa;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
        }
        
        input:focus { border-color: #ff69b4; }
        input::placeholder { color: #ffc0cb; }

        button {
            padding: 15px 50px;
            font-size: 26px;
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #ff69b4, #ffb6c1);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        button:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(255, 105, 180, 0.6); }
        button:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4); }
        button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .hidden { display: none !important; }
        h1 { color: #ff1493; margin-bottom: 10px; font-size: clamp(34px, 8vw, 48px); text-shadow: 2px 2px 0px #ffe4e1; text-align: center; }
        #game-over-text { color: #ff69b4; font-size: 28px; margin-bottom: 30px; white-space: pre-line; text-align: center; line-height: 1.5;}

        @media (max-width: 600px) {
            #sidebar {
                top: max(8px, env(safe-area-inset-top));
                right: max(8px, env(safe-area-inset-right));
                width: 145px;
            }
            .panel h2 { font-size: 15px; }
            #player-list li { font-size: 13px; gap: 4px; }
            #player-list li .rank-name { max-width: 74px; }
            #player-list li .rank-percent { min-width: 48px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 시작 화면 -->
        <div id="login-screen">
            <h1>🎨 젤리 땅따먹기</h1>
            <p style="color: #ff69b4; margin-bottom: 25px; font-size: 20px;">화면을 스와이프해서 이동하세요!</p>
            <input type="text" id="nickname" placeholder="내 이름은?" maxlength="5">
            <button id="start-btn">시작하기!</button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="game-over-screen" class="hidden">
            <h1>앗, 부딪혔어요! 💦</h1>
            <div id="game-over-text">다시 도전해보세요!</div>
            <button id="restart-btn">다시 할래!</button>
        </div>

        <!-- 게임 화면 영역 -->
        <div id="canvas-wrapper">
            <canvas id="game-canvas" width="800" height="600"></canvas>
        </div>

        <!-- 오른쪽 접속자 목록 -->
        <div id="sidebar">
            <div class="panel">
                <h2>🏆 실시간 랭킹</h2>
                <ul id="player-list">
                    <!-- 접속한 사람들이 여기에 표시됩니다 -->
                </ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ============================================================
        // Firebase 설정 - GitHub Pages에서 그대로 작동하는 웹앱용 설정
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDrqOcf1Df1mrtR7l-Q9H8bjnqweaxclVk",
            authDomain: "paperio-92034.firebaseapp.com",
            projectId: "paperio-92034",
            storageBucket: "paperio-92034.firebasestorage.app",
            messagingSenderId: "847215519861",
            appId: "1:847215519861:web:2877938b164b0a764a303c",
            measurementId: "G-E6XQF20XH8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Firestore 경로: games / jelly-paper-io / players / 사용자UID
        const appId = 'jelly-paper-io';

        // 🌟 게임 기본 설정
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));

        function shortName(name) {
            return Array.from((name || '젤리').trim()).slice(0, 5).join('') || '젤리';
        }
        
        // 🚀 대규모 맵 설정 (20명 수용 가능하도록 250칸으로 대폭 확장)
        const GRID_SIZE = 250; 
        const CELL_SIZE = 20;  
        const MAP_WIDTH = GRID_SIZE * CELL_SIZE;  // 5000 픽셀
        const MAP_HEIGHT = GRID_SIZE * CELL_SIZE; // 5000 픽셀
        const TOTAL_AREA = GRID_SIZE * GRID_SIZE;

        const GAME_TICK = 100; // 이동 속도
        const ACTIVE_TIMEOUT = 120000; // 접속 유지 판정: 기기 시간 차이 때문에 넉넉하게 2분

        let myUid = null;
        let myPlayer = null;
        let players = {}; 

        let gameLoopInterval = null;
        let syncInterval = null;
        let unsubscribePlayers = null;
        let inputControlsReady = false;
        let animationStarted = false;
        let gameSessionId = null;

        // 보조 함수
        function isMyTerritory(x, y, territory) { return territory.some(t => t.x === x && t.y === y); }
        function isMyTrail(x, y, trail) { return trail.some(t => t.x === x && t.y === y); }

        function getLastActiveMillis(value) {
            if (!value) return 0;
            if (typeof value === 'number') return value;
            if (typeof value.toMillis === 'function') return value.toMillis();
            if (value.seconds) return value.seconds * 1000;
            return 0;
        }

        function isRecentlyActive(player) {
            const last = getLastActiveMillis(player.lastActive);
            if (!last) return true;
            return Date.now() - last < ACTIVE_TIMEOUT;
        }

        function getRandomColor() {
            // 색이 겹쳐 보이지 않도록 팔레트를 늘리고, 현재 접속 중인 색은 우선 피합니다.
            const colors = [
                '#FF5DA2', '#4DA3FF', '#35C759', '#FFB000', '#A66CFF',
                '#FF6B6B', '#00B8A9', '#FF8A3D', '#6C7BFF', '#C77DFF',
                '#2EC4B6', '#F15BB5', '#00BBF9', '#FEE440', '#9B5DE5',
                '#70E000', '#FF477E', '#3A86FF', '#FB8500', '#06D6A0'
            ];

            const activeColors = Object.values(players || {})
                .filter(p => p && p.isAlive && p.color)
                .map(p => p.color.toUpperCase());

            const availableColors = colors.filter(color => !activeColors.includes(color.toUpperCase()));

            // 아직 안 쓰는 색이 있으면 그중에서 랜덤 선택
            if (availableColors.length > 0) {
                return availableColors[Math.floor(Math.random() * availableColors.length)];
            }

            // 20명을 넘어가면 가장 적게 쓰인 색을 선택
            const colorCount = {};
            colors.forEach(color => colorCount[color] = 0);
            activeColors.forEach(color => {
                const matched = colors.find(c => c.toUpperCase() === color);
                if (matched) colorCount[matched] += 1;
            });

            const minCount = Math.min(...Object.values(colorCount));
            const leastUsedColors = colors.filter(color => colorCount[color] === minCount);
            return leastUsedColors[Math.floor(Math.random() * leastUsedColors.length)];
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = true;
        startBtn.textContent = '서버 연결 중...';

        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("익명 로그인 실패:", error);
                alert("Firebase 연결에 실패했습니다. Authentication에서 익명 로그인을 켰는지 확인해주세요.");
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                myUid = user.uid;
                startBtn.disabled = false;
                startBtn.textContent = '시작하기!';
            }
        });

        initAuth();

        async function syncToFirebase() {
            if (!myUid || !myPlayer) return;
            try {
                const playerRef = doc(db, 'games', appId, 'players', myUid);
                myPlayer.lastActive = Date.now(); // 내 화면용 즉시 갱신
                await setDoc(playerRef, { ...myPlayer, lastActive: serverTimestamp() });
            } catch (error) {}
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        async function startGame() {
            const nickname = shortName(document.getElementById('nickname').value || '젤리');
            if (!myUid) {
                alert('게임 서버에 연결 중입니다. 잠시 후 다시 눌러주세요.');
                return;
            }

            // 다시하기 직후 이전 게임 루프/동기화가 남아 있으면 새 캐릭터가 멈출 수 있어서 먼저 정리합니다.
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            if (syncInterval) clearInterval(syncInterval);
            gameLoopInterval = null;
            syncInterval = null;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');

            // 매 판마다 고유 세션 ID를 부여합니다. 이전 판의 죽은 상태 스냅샷이 늦게 도착해도 새 판을 죽이지 않게 하기 위함입니다.
            gameSessionId = `${myUid}-${Date.now()}-${Math.floor(Math.random() * 100000)}`;

            // 🌟 250x250 거대한 맵 어디서든 태어날 수 있게 스폰 반경 확장 (가장자리 20칸 제외)
            const startX = Math.floor(Math.random() * (GRID_SIZE - 40)) + 20;
            const startY = Math.floor(Math.random() * (GRID_SIZE - 40)) + 20;

            myPlayer = {
                uid: myUid, sessionId: gameSessionId, name: nickname, color: getRandomColor(),
                x: startX, y: startY,
                dx: 0, dy: -1, nextDx: 0, nextDy: -1,
                trail: [], territory: [],
                score: 9, percent: (9 / TOTAL_AREA * 100).toFixed(4), // 소수점 4자리까지 표시 (맵이 커져서)
                isAlive: true, lastActive: Date.now()
            };

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    myPlayer.territory.push({ x: startX + dx, y: startY + dy });
                }
            }

            await syncToFirebase();
            listenToGameData();

            if (!inputControlsReady) {
                window.addEventListener('keydown', handleInput);
                setupSwipeControls();
                inputControlsReady = true;
            }

            gameLoopInterval = setInterval(updateGameLogic, GAME_TICK); 
            syncInterval = setInterval(syncToFirebase, 200);
            if (!animationStarted) {
                animationStarted = true;
                requestAnimationFrame(drawGame);
            }
        }

        function listenToGameData() {
            if (unsubscribePlayers) return;
            const playersRef = collection(db, 'games', appId, 'players');
            unsubscribePlayers = onSnapshot(playersRef, (snapshot) => {
                players = {};
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (isRecentlyActive(data)) players[docSnap.id] = data;
                });

                const remoteMe = players[myUid];
                // 다시하기 직후 이전 판의 isAlive:false 스냅샷이 늦게 도착하는 경우가 있습니다.
                // sessionId가 현재 판과 같을 때만 실제 사망으로 처리합니다.
                if (remoteMe && remoteMe.isAlive === false && myPlayer && myPlayer.isAlive === true) {
                    if (!remoteMe.sessionId || remoteMe.sessionId === myPlayer.sessionId) die();
                }
                updatePlayerList();
            });
        }

        function handleInput(e) {
            if (e.key === 'ArrowUp' || e.key === 'w') setDirection(0, -1);
            else if (e.key === 'ArrowDown' || e.key === 's') setDirection(0, 1);
            else if (e.key === 'ArrowLeft' || e.key === 'a') setDirection(-1, 0);
            else if (e.key === 'ArrowRight' || e.key === 'd') setDirection(1, 0);
        }

        function setDirection(dx, dy) {
            if (!myPlayer || !myPlayer.isAlive) return;
            if (dx !== 0 && myPlayer.dy !== 0) { myPlayer.nextDx = dx; myPlayer.nextDy = 0; }
            if (dy !== 0 && myPlayer.dx !== 0) { myPlayer.nextDx = 0; myPlayer.nextDy = dy; }
        }

        function setupSwipeControls() {
            let touchStartX = 0;
            let touchStartY = 0;
            const canvasWrapper = document.getElementById('canvas-wrapper');

            canvasWrapper.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: false });

            canvasWrapper.addEventListener('touchmove', (e) => {
                e.preventDefault(); 
                let touchEndX = e.changedTouches[0].screenX;
                let touchEndY = e.changedTouches[0].screenY;
                
                let dx = touchEndX - touchStartX;
                let dy = touchEndY - touchStartY;
                
                const threshold = 30; 

                if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) setDirection(1, 0); 
                        else setDirection(-1, 0); 
                    } else {
                        if (dy > 0) setDirection(0, 1); 
                        else setDirection(0, -1); 
                    }
                    touchStartX = touchEndX;
                    touchStartY = touchEndY;
                }
            }, { passive: false });
        }

        function updateGameLogic() {
            if (!myPlayer || !myPlayer.isAlive) return;

            myPlayer.dx = myPlayer.nextDx;
            myPlayer.dy = myPlayer.nextDy;

            let nextX = myPlayer.x + myPlayer.dx;
            let nextY = myPlayer.y + myPlayer.dy;

            if (nextX < 0 || nextX >= GRID_SIZE || nextY < 0 || nextY >= GRID_SIZE) { die(); return; }
            if (isMyTrail(nextX, nextY, myPlayer.trail)) { die(); return; }

            for (const uid in players) {
                if (uid !== myUid && players[uid].isAlive) {
                    if (isMyTrail(nextX, nextY, players[uid].trail)) {
                        updateDoc(doc(db, 'games', appId, 'players', uid), { isAlive: false });
                    }
                }
            }

            myPlayer.x = nextX;
            myPlayer.y = nextY;
            myPlayer.lastActive = Date.now();

            if (isMyTerritory(nextX, nextY, myPlayer.territory)) {
                if (myPlayer.trail.length > 0) {
                    captureTerritory(); 
                    myPlayer.trail = [];
                    syncToFirebase();
                }
            } else {
                myPlayer.trail.push({ x: nextX, y: nextY });
            }
        }

        function captureTerritory() {
            let map = Array(GRID_SIZE).fill().map(() => new Uint8Array(GRID_SIZE));
            myPlayer.territory.forEach(p => map[p.y][p.x] = 1);
            myPlayer.trail.forEach(p => map[p.y][p.x] = 1);

            let queue = [];
            for(let i=0; i<GRID_SIZE; i++) {
                if(map[0][i] === 0) { queue.push({x: i, y: 0}); map[0][i] = 2; }
                if(map[GRID_SIZE-1][i] === 0) { queue.push({x: i, y: GRID_SIZE-1}); map[GRID_SIZE-1][i] = 2; }
                if(map[i][0] === 0) { queue.push({x: 0, y: i}); map[i][0] = 2; }
                if(map[i][GRID_SIZE-1] === 0) { queue.push({x: GRID_SIZE-1, y: i}); map[i][GRID_SIZE-1] = 2; }
            }

            let head = 0;
            while(head < queue.length) {
                let curr = queue[head++];
                let cx = curr.x, cy = curr.y;
                if (cx > 0 && map[cy][cx-1] === 0) { map[cy][cx-1] = 2; queue.push({x: cx-1, y: cy}); }
                if (cx < GRID_SIZE-1 && map[cy][cx+1] === 0) { map[cy][cx+1] = 2; queue.push({x: cx+1, y: cy}); }
                if (cy > 0 && map[cy-1][cx] === 0) { map[cy-1][cx] = 2; queue.push({x: cx, y: cy-1}); }
                if (cy < GRID_SIZE-1 && map[cy+1][cx] === 0) { map[cy+1][cx] = 2; queue.push({x: cx, y: cy+1}); }
            }

            let newTerritory = [];
            const claimedCells = new Set();
            for(let y=0; y<GRID_SIZE; y++) {
                for(let x=0; x<GRID_SIZE; x++) {
                    if(map[y][x] !== 2) {
                        newTerritory.push({x: x, y: y});
                        claimedCells.add(`${x},${y}`);
                    }
                }
            }

            // 내가 새로 차지한 칸은 다른 플레이어의 땅에서 제거합니다.
            // 이 처리가 없으면 같은 칸이 여러 명의 땅으로 겹쳐 저장됩니다.
            for (const uid in players) {
                if (uid === myUid) continue;
                const other = players[uid];
                if (!other || !Array.isArray(other.territory)) continue;

                const trimmedTerritory = other.territory.filter(t => !claimedCells.has(`${t.x},${t.y}`));
                if (trimmedTerritory.length !== other.territory.length) {
                    const newScore = trimmedTerritory.length;
                    updateDoc(doc(db, 'games', appId, 'players', uid), {
                        territory: trimmedTerritory,
                        score: newScore,
                        percent: ((newScore / TOTAL_AREA) * 100).toFixed(4)
                    }).catch(err => console.warn('상대 땅 정리 실패:', err));
                }
            }

            myPlayer.territory = newTerritory;
            myPlayer.score = newTerritory.length;
            myPlayer.percent = ((myPlayer.score / TOTAL_AREA) * 100).toFixed(4);
        }

        function die() {
            if (!myPlayer) return;
            myPlayer.isAlive = false;
            myPlayer.lastActive = Date.now();
            syncToFirebase();
            clearInterval(gameLoopInterval);
            clearInterval(syncInterval);
            gameLoopInterval = null;
            syncInterval = null;
            
            const myScore = myPlayer.score || 0;
            const activePlayers = Object.values({ ...players, [myUid]: myPlayer })
                .filter(p => p && isRecentlyActive(p));
            const rank = activePlayers.filter(p => (p.score || 0) > myScore).length + 1;

            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-text').innerText = `내 순위: ${rank}위\n내 땅 넓이: ${myPlayer.percent}%`;
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!myPlayer) { requestAnimationFrame(drawGame); return; }

            let cameraX = (myPlayer.x * CELL_SIZE) - (canvas.width / 2) + (CELL_SIZE / 2);
            let cameraY = (myPlayer.y * CELL_SIZE) - (canvas.height / 2) + (CELL_SIZE / 2);

            const maxCamX = MAP_WIDTH - canvas.width;
            const maxCamY = MAP_HEIGHT - canvas.height;
            cameraX = Math.max(0, Math.min(cameraX, maxCamX));
            cameraY = Math.max(0, Math.min(cameraY, maxCamY));

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // 🚀 최적화(Culling) 계산: 화면(카메라)에 보이는 영역(Start/End)만 구하기
            const cullPad = 1;
            const startCol = Math.max(0, Math.floor(cameraX / CELL_SIZE) - cullPad);
            const endCol = Math.min(GRID_SIZE, Math.ceil((cameraX + canvas.width) / CELL_SIZE) + cullPad);
            const startRow = Math.max(0, Math.floor(cameraY / CELL_SIZE) - cullPad);
            const endRow = Math.min(GRID_SIZE, Math.ceil((cameraY + canvas.height) / CELL_SIZE) + cullPad);

            ctx.strokeStyle = '#f5f5f5';
            ctx.lineWidth = 1;
            for (let x = startCol; x <= endCol; x++) { ctx.beginPath(); ctx.moveTo(x * CELL_SIZE, startRow * CELL_SIZE); ctx.lineTo(x * CELL_SIZE, endRow * CELL_SIZE); ctx.stroke(); }
            for (let y = startRow; y <= endRow; y++) { ctx.beginPath(); ctx.moveTo(startCol * CELL_SIZE, y * CELL_SIZE); ctx.lineTo(endCol * CELL_SIZE, y * CELL_SIZE); ctx.stroke(); }

            // 플레이어 그리기 (화면에 보이는 땅만 그리도록 최적화)
            for (const uid in players) {
                const p = players[uid];
                if (!p.isAlive) continue; 
                
                ctx.fillStyle = p.color;
                
                // 1. 땅 그리기 (최적화 적용)
                ctx.globalAlpha = 0.5;
                if(p.territory) {
                    p.territory.forEach(t => {
                        // 🚀 내 화면에 보이는 땅만 그립니다 (렉 방지)
                        if (t.x >= startCol && t.x <= endCol && t.y >= startRow && t.y <= endRow) {
                            ctx.fillRect(t.x * CELL_SIZE, t.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    });
                }

                // 2. 꼬리 그리기 (최적화 적용)
                ctx.globalAlpha = 0.9;
                if(p.trail) {
                    p.trail.forEach(t => {
                        if (t.x >= startCol && t.x <= endCol && t.y >= startRow && t.y <= endRow) {
                            ctx.fillRect(t.x * CELL_SIZE, t.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        }
                    });
                }

                ctx.globalAlpha = 1.0;
                
                // 캐릭터 본체는 위치 상관없이 계산 (캐릭터는 1개니까 부하 적음)
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.roundRect(p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE, 4);
                ctx.fill();
                
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#666';
                ctx.font = 'bold 14px "Jua", sans-serif';
                ctx.textAlign = 'center';
                if (uid === myUid) {
                    ctx.fillText('⭐ ' + shortName(p.name), p.x * CELL_SIZE + (CELL_SIZE/2), p.y * CELL_SIZE - 8);
                } else {
                    ctx.fillText(shortName(p.name), p.x * CELL_SIZE + (CELL_SIZE/2), p.y * CELL_SIZE - 8);
                }
            }

            ctx.restore();

            /* ====================================================================
               🌟 우측 하단 미니맵 (전체 맵)
            ==================================================================== */
            const MINIMAP_SIZE = 140; // 맵이 커져서 미니맵도 살짝 키움
            const minimapScale = MINIMAP_SIZE / GRID_SIZE; 
            const minimapX = canvas.width - MINIMAP_SIZE - 15; 
            const minimapY = canvas.height - MINIMAP_SIZE - 15; 

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath(); ctx.roundRect(minimapX, minimapY, MINIMAP_SIZE, MINIMAP_SIZE, 10); ctx.fill();
            ctx.strokeStyle = '#ffb6c1';
            ctx.lineWidth = 3;
            ctx.stroke();

            for (const uid in players) {
                const p = players[uid];
                if (!p.isAlive) continue; 
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.6;
                if(p.territory) {
                    p.territory.forEach(t => {
                        // 미니맵 점이 너무 작아 보이지 않게 +0.5 보정
                        ctx.fillRect(minimapX + t.x * minimapScale, minimapY + t.y * minimapScale, minimapScale + 0.5, minimapScale + 0.5);
                    });
                }

                ctx.globalAlpha = 1.0;
                if (uid === myUid) {
                    ctx.fillStyle = '#ff1493'; 
                    ctx.fillRect(minimapX + p.x * minimapScale - 2, minimapY + p.y * minimapScale - 2, minimapScale + 4, minimapScale + 4);
                }
                ctx.fillStyle = p.color;
                ctx.fillRect(minimapX + p.x * minimapScale - 1, minimapY + p.y * minimapScale - 1, minimapScale + 2, minimapScale + 2);
            }

            requestAnimationFrame(drawGame);
        }

        function updatePlayerList() {
            const list = document.getElementById('player-list');
            list.innerHTML = ''; 
            const sortedPlayers = Object.values(players).filter(p => p.isAlive).sort((a, b) => (b.score || 0) - (a.score || 0));

            sortedPlayers.forEach(p => {
                const li = document.createElement('li');
                li.style.borderLeftColor = p.color;
                const percent = p.percent || "0.0000";
                const nameText = p.uid === myUid ? `⭐ ${shortName(p.name)}` : shortName(p.name);
                li.innerHTML = `<span class="rank-name">${nameText}</span><span class="rank-percent">${percent}%</span>`;
                list.appendChild(li);
            });
        }
    </script>
</body>
